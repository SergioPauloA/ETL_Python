# Ambiente LOCAL de estudo: Airflow + PostgreSQL (OLTP AdventureWorks) + PostgreSQL (DW)
#
# SEGURANÇA / CREDENCIAIS
#  - Nenhum login/senha em arquivo versionado: os bancos usam autenticação "trust"
#    e as portas ficam acessíveis apenas em 127.0.0.1 (uso exclusivo local).
#  - O Airflow acessa os bancos por CONEXÕES NOMEADAS (aw_oltp e dw_postgres),
#    armazenadas no banco de metadados do Airflow (Admin > Connections).
#  - A senha do usuário admin do Airflow é GERADA no primeiro start e gravada em
#    logs/admin_login.txt (pasta ignorada pelo Git).
#
# Uso: docker compose up -d
services:

  postgres-airflow:                      # metadados do Airflow
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pg_airflow:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  postgres-oltp:                         # origem: AdventureWorks (carregar conforme README)
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: Adventureworks
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_oltp:/var/lib/postgresql/data

  postgres-dw:                           # destino: Data Warehouse
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dw_adventureworks
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pg_dw:/var/lib/postgresql/data

  airflow:
    image: apache/airflow:2.9.3
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./sql:/opt/airflow/sql
      - ./logs:/opt/airflow/logs
    command:
      - bash
      - -c
      - |
        airflow db migrate
        if ! airflow users list 2>/dev/null | grep -q " admin "; then
          SENHA=$$(python -c "import secrets; print(secrets.token_urlsafe(9))")
          airflow users create --username admin --password "$$SENHA" --firstname Admin --lastname Admin --role Admin --email admin@example.com && echo "usuario: admin | senha: $$SENHA" > /opt/airflow/logs/admin_login.txt
        fi
        # Conexões nomeadas do Airflow (sem senha: bancos locais com autenticação trust)
        airflow connections delete aw_oltp > /dev/null 2>&1 || true
        airflow connections add aw_oltp --conn-type postgres --conn-host postgres-oltp --conn-port 5432 --conn-login postgres --conn-schema Adventureworks
        airflow connections delete dw_postgres > /dev/null 2>&1 || true
        airflow connections add dw_postgres --conn-type postgres --conn-host postgres-dw --conn-port 5432 --conn-login postgres --conn-schema dw_adventureworks
        airflow scheduler &
        exec airflow webserver

volumes:
  pg_airflow:
  pg_oltp:
  pg_dw:
