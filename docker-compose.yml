# Ambiente local: Airflow + PostgreSQL (OLTP AdventureWorks) + PostgreSQL (DW)
# Uso: cp .env.example .env  (edite as senhas)  ->  docker compose up -d
services:

  postgres-airflow:                      # metadados do Airflow
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - pg_airflow:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}"]
      interval: 5s
      retries: 10

  postgres-oltp:                         # origem: AdventureWorks (carregar conforme README)
    image: postgres:16
    environment:
      POSTGRES_USER: ${OLTP_USER}
      POSTGRES_PASSWORD: ${OLTP_PASSWORD}
      POSTGRES_DB: ${OLTP_DB}
    ports:
      - "5433:5432"
    volumes:
      - pg_oltp:/var/lib/postgresql/data

  postgres-dw:                           # destino: Data Warehouse
    image: postgres:16
    environment:
      POSTGRES_USER: ${DW_USER}
      POSTGRES_PASSWORD: ${DW_PASSWORD}
      POSTGRES_DB: ${DW_DB}
    ports:
      - "5434:5432"
    volumes:
      - pg_dw:/var/lib/postgresql/data

  airflow:
    image: apache/airflow:2.9.3
    depends_on:
      postgres-airflow:
        condition: service_healthy
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      # AIRFLOW_CONN_AW_OLTP e AIRFLOW_CONN_DW_POSTGRES vêm do .env (env_file)
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./sql:/opt/airflow/sql
      - ./logs:/opt/airflow/logs
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create --username "$$AIRFLOW_ADMIN_USER" --password "$$AIRFLOW_ADMIN_PASSWORD" --firstname Admin --lastname Admin --role Admin --email admin@example.com || echo "AVISO: usuario admin ja existe ou nao foi criado"
        airflow scheduler &
        exec airflow webserver

volumes:
  pg_airflow:
  pg_oltp:
  pg_dw:
